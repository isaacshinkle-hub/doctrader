<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocTrader — Market notes, videos, and a watchlist</title>
<meta name="description" content="DocTrader: trading notes and a public watchlist. Sister site to DocDiver.">
<link rel="canonical" href="https://doctrader.org/">
<style>
  :root { --bg:#0f1115; --ink:#f3efe6; --muted:#a8a093; --accent:#d8a45a; --line:#2a2d34; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: var(--bg); color: var(--ink); font-family: Georgia, "Times New Roman", serif; line-height: 1.6; }
  main { max-width: 42rem; margin: 0 auto; padding: 18vh 1.5rem 4rem; }
  p.kicker { color: var(--accent); letter-spacing: .14em; text-transform: uppercase; font-size: .78rem; font-family: system-ui, sans-serif; }
  h1 { font-size: clamp(2.4rem, 7vw, 4rem); font-weight: 400; margin: .4rem 0 1rem; }
  p { color: var(--muted); font-size: 1.1rem; }
  nav { margin-top: 2rem; display: flex; gap: 1rem; flex-wrap: wrap; }
  a { color: var(--ink); }
  a.btn { display: inline-block; padding: .65rem 1rem; border: 1px solid var(--line); text-decoration: none; font-family: system-ui, sans-serif; font-size: .9rem; }
  a.btn.primary { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<main>
  <p class="kicker">Holding page</p>
  <h1>DocTrader</h1>
  <p>Market notes, videos, and a public watchlist. This domain is live on GitHub Pages. Full site comes next.</p>
  <nav>
    <a class="btn primary" href="https://docdiver.org/">DocDiver</a>
  </nav>
</main>
</body>
</html>
